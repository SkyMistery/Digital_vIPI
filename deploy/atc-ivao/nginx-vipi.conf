server {
    listen 443 ssl http2;
    server_name atc.it.ivao.aero;

    # ssl_certificate     /etc/letsencrypt/live/atc.it.ivao.aero/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/atc.it.ivao.aero/privkey.pem;

    # I file di diagnostica (diagnostica/avvio-diagnostica.txt, avvio-errore.txt, errori-richieste.txt) NON
    # devono essere raggiungibili dal web: contengono stack trace completi, percorsi del server e i VID di
    # chi ha incontrato l'errore. L'applicazione li scrive accanto al proprio eseguibile.
    #
    # ⚠️ QUESTA RIGA NON PROTEGGE atc.it.ivao.aero, e crederlo sarebbe un errore silenzioso: là il sito gira
    # su Plesk + Passenger e questa conf non viene caricata da nessuno — è riferimento per un deploy
    # systemd+nginx. ✅ Su quel server l'accesso ai file è stato chiuso lato hosting il 25 agosto 2026
    # (le richieste passano ora tutte all'applicazione: /appsettings.Production.json e i file alla radice
    # rispondono 404, misurato dall'esterno). Fino al 24 agosto la cartella dell'app ERA il document root e
    # /appsettings.Production.json rispondeva 200. Vedi docs/lavori-aperti.md §A13.
    location ~ ^/diagnostica/ {
        deny all;
    }

    # TUTTO il dominio va all'app, non solo /services/vsop: i callback del login IVAO
    # (/signin-oidc e /signout-callback-oidc) stanno sulla RADICE.
    location / {
        proxy_pass http://127.0.0.1:5000;

        # --- WebSocket: senza queste tre righe le pagine si aprono e restano MUTE. ---
        # L'app è Blazor Server, l'interattività viaggia su WebSocket. Non dà errore:
        # la pagina compare, i pulsanti non rispondono. È il guasto più difficile da riconoscere.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- Header inoltrati: senza X-Forwarded-Proto i redirect del login tornano in http:// ---
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr e NON $proxy_add_x_forwarded_for: quest'ultimo APPENDE l'IP vero a quello che il
        # client ha già messo nell'header, quindi il chiamante sceglie il primo valore della lista. Su
        # quell'IP si regge il tetto per-IP del bridge Aurora e ogni riga di log che dice «da dove».
        # Qui non c'è nessun proxy davanti a nginx: la catena comincia e finisce con l'indirizzo vero.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Il circuito Blazor è una connessione lunga per natura: con i 60s di default
        # cade da sola ogni minuto e l'utente vede «Tentativo di riconnessione».
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;

        # Lo streaming SSE dell'ATC live non va bufferizzato, o arriva a blocchi.
        proxy_buffering off;
    }
}

# ⚠️ UNA SOLA ISTANZA DELL'APPLICAZIONE. Blazor Server tiene lo stato dell'utente in un «circuito» vivo
# nel processo che l'ha aperto: senza un backplane condiviso, due processi dietro un bilanciatore si
# rimpallano le richieste e le pagine cadono in continua riconnessione. Se un domani servisse scalare,
# la scelta non è aggiungere un processo ma aggiungere prima un backplane (voce A2 dell'audit del 22
# luglio 2026). Con un `proxy_pass` a un solo indirizzo, come qui sopra, il problema non si pone.

server {
    listen 80;
    server_name atc.it.ivao.aero;
    return 301 https://$host$request_uri;
}
