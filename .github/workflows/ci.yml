name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Vipi.slnx
      - run: dotnet build Vipi.slnx --no-restore -c Release
      - run: dotnet test Vipi.slnx --no-build -c Release --verbosity normal

  # Il ramo net8.0 delle librerie (embedding nel sito Ivao.It) NON è coperto dalla suite: i test girano
  # tutti su net10. Senza questo job, un'API .NET 9+ o una sintassi C# 13+ entrerebbe con la CI verde e si
  # scoprirebbe solo il giorno dell'integrazione. Vedi docs/guide/integration.md §Target framework.
  build-net8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # Il SDK 10 sa già compilare per net8.0 (scarica i targeting pack da NuGet), ma installare anche
          # l'8 toglie di mezzo una classe di fallimenti se quel comportamento cambia.
          dotnet-version: |
            8.0.x
            10.0.x
      # Vipi.Hosting tira gli altri quattro progetti del modulo: basta lui per coprire tutto il ramo net8.
      # Non si compila la solution: Vipi.Host e i progetti di test sono net10.0 soli, per scelta.
      - run: dotnet restore src/Vipi.Hosting/Vipi.Hosting.csproj -p:TargetFramework=net8.0
      - run: dotnet build src/Vipi.Hosting/Vipi.Hosting.csproj -f net8.0 --no-restore -c Release -warnaserror

  # L'immagine è ciò che gira davvero su Render: se il Dockerfile si rompe, i test verdi non se ne accorgono.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build dell'immagine (stesso Dockerfile del deploy)
        run: docker build -t vipi:ci .
      - name: Smoke del container
        run: |
          # DB su /tmp: in aspnet:10.0 il processo gira come utente non-root e /app non è scrivibile.
          # VipiAuth spento: senza i segreti OIDC l'avvio in Production fallirebbe (vedi Auth/VipiAuth).
          docker run -d --name vipi -p 8080:8080 \
            -e VipiAuth__Enabled=false \
            -e ConnectionStrings__Vipi="Data Source=/tmp/vipi.db" \
            vipi:ci
          # Stesso endpoint che sonda Render: 200 se il DB risponde e lo schema è allineato, 503 altrimenti.
          # -f rende il curl il vero criterio di successo. Non si usa /vsop/health perché degraderebbe per la
          # cache ATC vuota (nessuna credenziale IVAO in CI), che qui non è un difetto.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/vsop/health/ready; then echo; echo "container su"; exit 0; fi
            sleep 2
          done
          echo "il container non ha risposto in 60s"
          docker logs vipi
          exit 1
      - name: Log del container
        if: always()
        run: docker logs vipi || true
