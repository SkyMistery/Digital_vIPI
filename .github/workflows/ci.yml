name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # Servono entrambi. I test sono multi-target, e senza il runtime 8 installato l'assembly net8.0
          # girerebbe in roll-forward sul runtime 10: il ramo dell'embedding si proverebbe su un runtime che
          # l'host di Ivao.It non ha. La produzione è net10 dal 13 settembre 2026 (L13).
          dotnet-version: |
            8.0.x
            10.0.401
      # ⚠️ 10.0.401 ESATTO, lo stesso di global.json, e non 10.0.x (L13, 13 settembre 2026): con l'host net10 la
      # versione del runtime la decide l'SDK — il pacchetto implicito Microsoft.AspNetCore.App.Internal.Assets
      # entra nel lock con la versione del runtime incluso, e il publish self-contained porta quel runtime in
      # produzione. Con 10.0.x la CI prendeva un SDK più nuovo di quello di chi scrive il lock, e il restore in
      # locked mode si fermava su NU1004. Si cambia qui e in global.json INSIEME, poi si rigenerano i lock.
      # --locked-mode: usa i packages.lock.json committati e FALLISCE se una versione è cambiata senza che
      # nessuno l'abbia scritta. Con le wildcard nei csproj (8.0.*, 10.0.*) è l'unica cosa che rende
      # riproducibile il pacchetto consegnato: senza, lo stesso commit compilato fra due mesi è un altro
      # binario. Se la CI si ferma qui, il rimedio è un `dotnet restore --force-evaluate` locale e un commit
      # dei lock aggiornati — cioè rendere visibile l'aggiornamento invece di subirlo.
      - run: dotnet restore Vipi.slnx --locked-mode
      # Gli avvisi sono errori (Directory.Build.props): non serve più -warnaserror qui né in un job a parte.
      - run: dotnet build Vipi.slnx --no-restore -c Release
      # Dall'11 agosto 2026 questa riga esegue ENTRAMBI i TFM di ogni progetto multi-target: prima erano
      # net10 tutti tranne Vipi.Infrastructure.Tests, cioè ~1000 test che non toccavano mai il runtime di
      # produzione di allora (net8). Da L13 la produzione è net10 e questo job la copre per intero.
      # `tee`: la corsa si vede in diretta E finisce in un file, perche' il passo dopo la deve contare.
      # ATTENZIONE: `shell: bash` NON e' cosmetico. Il guscio di serie di GitHub e' `bash -e`, SENZA
      # `pipefail`: in una pipe l'esito e' quello dell'ULTIMO comando, cioe' `tee`, che riesce sempre.
      # Un `dotnet test` rosso passerebbe per verde. `shell: bash` aggiunge `-o pipefail`.
      # 🔴 `--logger "console;verbosity=minimal"` NON è cosmetico: con la sola `--verbosity normal` il riepilogo
      # esce come «Test Run Successful. Total tests: N», SENZA assieme né TFM, e conta-test non trova niente da
      # contare. Il cancello T-056 non aveva quindi mai potuto scattare: lo si è visto il 13 settembre 2026, alla
      # prima corsa in cui i test arrivavano in fondo. Il logger minimale stampa «Passed! - ... .dll (net8.0)» e
      # i dettagli dei test rossi; `--verbosity normal` resta per il log di MSBuild.
      - name: dotnet test (tutti i TFM)
        shell: bash
        run: dotnet test Vipi.slnx --no-build -c Release --verbosity normal --logger "console;verbosity=minimal" | tee corsa.log
      # ⚠️ Il numero dei test NON lo controlla `dotnet test`: se un progetto sparisce dalla corsa la
      # riga esce zero e la CI diventa verde su meno test di ieri. E' successo (vedi il commento sopra:
      # ~1000 test che non toccavano il runtime di produzione, per settimane). Qui calare fa rumore.
      - run: bash tools/conta-test.sh corsa.log

  # Il ramo net8.0 è quello dell'EMBEDDING in Ivao.It. Fino al 13 settembre 2026 era anche la produzione
  # (Vipi.Host net8 per Pomelo, ADR-0007 §D4-ter); da L13 l'host è net10 con lo stesso stack EF 8, e la
  # produzione la prova il job qui sopra, che corre tutti i TFM (E2E compreso, che è solo net10).
  #
  # ⚠️ Questo job ESEGUE i test, non li compila soltanto. Fino all'11 agosto 2026 faceva `dotnet build` di
  # Vipi.Hosting e basta: una compilazione riuscita diceva che il codice esisteva su net8, non che
  # funzionasse. Le due differenze fra i runtime che ci hanno già morso — il catch-all che risponde 405 su
  # net10 e 404 su net8, KnownIPNetworks che su net8 si chiama KnownNetworks — sono esattamente la classe
  # che un test coglie e una build no.
  test-net8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      # --locked-mode: usa i packages.lock.json committati e FALLISCE se una versione è cambiata senza che
      # nessuno l'abbia scritta. Con le wildcard nei csproj (8.0.*, 10.0.*) è l'unica cosa che rende
      # riproducibile il pacchetto consegnato: senza, lo stesso commit compilato fra due mesi è un altro
      # binario. Se la CI si ferma qui, il rimedio è un `dotnet restore --force-evaluate` locale e un commit
      # dei lock aggiornati — cioè rendere visibile l'aggiornamento invece di subirlo.
      - run: dotnet restore Vipi.slnx --locked-mode
      - name: dotnet test (solo net8.0, l'embedding)
        shell: bash
        # Il logger minimale: vedi il job qui sopra, senza non c'è niente da contare.
        # ⚠️ Progetto per progetto, e non `dotnet test Vipi.slnx -f net8.0`: da L13 (13 settembre 2026)
        # Vipi.E2E.Tests è SOLO net10, come l'host che avvia, e forzargli net8 ferma il job con NETSDK1005
        # («doesn't have a target for 'net8.0'»). Si prendono i progetti di test che net8 lo dichiarano davvero:
        # uno che lo perde sparisce da qui e conta-test lo dice come MANCA.
        run: |
          : > corsa-net8.log
          for p in $(grep -l -E '<TargetFrameworks?>[^<]*net8\.0' tests/*/*.csproj); do
            dotnet test "$p" -f net8.0 -c Release --verbosity normal --logger "console;verbosity=minimal" | tee -a corsa-net8.log
          done
      # Lo stesso cancello sul ramo net8: qui l'atteso comprende i soli assiemi net8.0, e un progetto che
      # smette di girare su net8 e' proprio il difetto dell'11 agosto.
      - run: bash tools/conta-test.sh corsa-net8.log --tfm net8.0

  # Lo schema di produzione contro un MariaDB VERO. È la classe di guasti che i test unitari non vedono: la
  # collation risultava presente e corretta nei metadati EF mentre nella DDL non c'era affatto (vedi
  # MySqlCollation), e il provider precedente si è rotto due volte in dieci minuti di contatto con un server
  # reale. Automatizza le verifiche della voce A1 di docs/lavori-aperti.md.
  mariadb-schema:
    runs-on: ubuntu-latest
    services:
      mariadb:
        # La versione ESATTA di atc.it.ivao.aero (SELECT VERSION() = 11.4.10-MariaDB-deb11), non il tag
        # mobile 11.4: fra due minori cambiano default che ci riguardano.
        image: mariadb:11.4.10
        env:
          MARIADB_ROOT_PASSWORD: radice-di-prova
          # Database creato SENZA collation esplicita — eredita il default del server, che è ai_ci — e
          # utente con permessi solo su quello: sono le condizioni loro. Le condizioni comode nasconderebbero
          # proprio i guasti che questo job cerca.
          MARIADB_DATABASE: itivao_atc
          MARIADB_USER: itivao_atc
          MARIADB_PASSWORD: prova-di-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CONN: "Server=127.0.0.1;Port=3306;Database=itivao_atc;User Id=itivao_atc;Password=prova-di-ci"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # Il progetto delle migrazioni è net8 e net10 (L13): `dotnet ef` esegue l'assembly net10, cioè quella
          # della produzione (`--framework` qui sotto). Il runtime 8 resta per il restore dei due TFM.
          dotnet-version: |
            8.0.x
            10.0.401

      - name: Strumenti EF
        run: dotnet tool install --global dotnet-ef --version "10.*"

      # `dotnet ef` compila il progetto ma NON lo restora: senza questa riga muore con NETSDK1004
      # (assets file mancante), che è un messaggio di NuGet e non parla né di EF né di migrazioni.
      - name: Restore del progetto delle migrazioni
        run: dotnet restore src/Vipi.Infrastructure.MySqlMigrations/Vipi.Infrastructure.MySqlMigrations.csproj

      - name: Applica le migrazioni MySQL su MariaDB
        # Si invoca l'eseguibile per percorso invece di `dotnet ef`. La forma con lo spazio passa dalla
        # dispatch della CLI, che qui non trova il comando e risponde «Run "dotnet tool restore"» mandando
        # a cercare un manifest di tool che questo repository non ha — anche con ~/.dotnet/tools aggiunto
        # a GITHUB_PATH. Il percorso è quello in cui `--global` installa, e non dipende da nient'altro.
        run: |
          "$HOME/.dotnet/tools/dotnet-ef" database update \
            --project src/Vipi.Infrastructure.MySqlMigrations \
            --startup-project src/Vipi.Infrastructure.MySqlMigrations \
            --framework net10.0 \
            --connection "$CONN"

      # Le verifiche si fanno SUL DATABASE, non sul modello: è la lezione che è costata di più in questa
      # migrazione. Il client viene dalla stessa immagine del server, così non dipende da cosa ha il runner.
      - name: Verifica lo schema prodotto
        run: |
          set -euo pipefail
          sql() {
            docker run --rm --network host mariadb:11.4.10 \
              mariadb -h 127.0.0.1 -P 3306 -u itivao_atc -pprova-di-ci itivao_atc \
              --batch --skip-column-names -e "$1"
          }
          fallisci() { echo "::error::$1"; exit 1; }

          echo "1. collation delle colonne stringa"
          # Fuori dalla nostra collation sono attese esattamente 2 colonne: MigrationId e ProductVersion di
          # __EFMigrationsHistory, che EF crea prima della nostra migrazione. Quei due valori li genera e li
          # confronta EF, quindi sono innocui — ma il numero deve restare 2: se cresce, una colonna nostra ha
          # perso la collation e i confronti tornano insensibili alle maiuscole senza dire niente.
          fuori=$(sql "SELECT COUNT(*) FROM information_schema.COLUMNS
                       WHERE TABLE_SCHEMA='itivao_atc' AND COLLATION_NAME IS NOT NULL
                         AND COLLATION_NAME <> 'utf8mb4_uca1400_as_cs';")
          [ "$fuori" = "2" ] || fallisci "colonne stringa fuori da utf8mb4_uca1400_as_cs: $fuori (attese 2, quelle di __EFMigrationsHistory)"

          echo "2. due valori che differiscono solo per le maiuscole convivono nell'indice unico"
          # Senza la collation sulla colonna il secondo INSERT sarebbe un duplicate key. LIRF e lirf sono
          # entrambi legittimi e arrivano dalla sorgente, non da una digitazione.
          sql "INSERT INTO Accs (Code,Name,CountryPrefix,IsMilitary,IsForeign,IsHidden) VALUES ('LIRF','x','LI',0,0,0);"
          sql "INSERT INTO Accs (Code,Name,CountryPrefix,IsMilitary,IsForeign,IsHidden) VALUES ('lirf','y','LI',0,0,0);"
          trovato=$(sql "SELECT GROUP_CONCAT(Code ORDER BY Code) FROM Accs WHERE Code = 'lirf';")
          [ "$trovato" = "lirf" ] || fallisci "WHERE Code='lirf' ha trovato '$trovato' invece del solo 'lirf'"
          sql "DELETE FROM Accs;"

          echo "3. i nomi di tabella conservano le maiuscole"
          # Verificabile SOLO su Linux: su Windows lower_case_table_names vale 1 o 2 e la differenza non si
          # vede. È il guasto che ha reso inutilizzabile il primo dump del travaso (A3).
          lctn=$(sql "SELECT @@lower_case_table_names;")
          [ "$lctn" = "0" ] || fallisci "lower_case_table_names=$lctn: questo server non distingue le maiuscole, la verifica 3 non proverebbe niente"
          esatta=$(sql "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='itivao_atc' AND TABLE_NAME='Accs';")
          minuscola=$(sql "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='itivao_atc' AND TABLE_NAME='accs';")
          { [ "$esatta" = "1" ] && [ "$minuscola" = "0" ]; } || fallisci "la tabella è nata come 'accs' invece che 'Accs': EF cercherebbe quella con le maiuscole"

          echo "4. la vista per l'hub: le dieci colonne del contratto, nell'ordine, e un utente che legge solo lei"
          # Carta docs/feature/2026-09-23-vista-condivisa-sessioni-atc.md. I nomi sono quelli che l'IVAO Division
          # Hub legge: se cambiano qui, l'hub resta senza dati e non lo dice nessun test di questo repository.
          colonne=$(sql "SELECT GROUP_CONCAT(COLUMN_NAME ORDER BY ORDINAL_POSITION) FROM information_schema.COLUMNS
                         WHERE TABLE_SCHEMA='itivao_atc' AND TABLE_NAME='v_share_atc_sessions';")
          attese="session_id,vid,callsign,position,frequency,start_utc,end_utc,duration_seconds,rating,is_outside_division"
          [ "$colonne" = "$attese" ] || fallisci "v_share_atc_sessions ha le colonne '$colonne' invece di '$attese'"
          # Il GRANT che in produzione fa chi amministra il server, qui fatto da root: l'utente dell'hub legge la
          # vista (SQL SECURITY DEFINER) e non la tabella sotto.
          root() {
            docker run --rm --network host mariadb:11.4.10 \
              mariadb -h 127.0.0.1 -P 3306 -u root -pradice-di-prova --batch --skip-column-names -e "$1"
          }
          root "CREATE USER 'hub_lettore'@'%' IDENTIFIED BY 'lettore-di-ci';
                GRANT SELECT ON itivao_atc.v_share_atc_sessions TO 'hub_lettore'@'%';"
          hub() {
            docker run --rm --network host mariadb:11.4.10 \
              mariadb -h 127.0.0.1 -P 3306 -u hub_lettore -plettore-di-ci itivao_atc --batch --skip-column-names -e "$1"
          }
          sql "INSERT INTO AtcSessions (SessionId,UserId,Callsign,StartUtc,DurationSeconds,IsOutsideDivision,Source,ShiftKey,TrafficCount,MovementCount,TrafficMinutes)
               VALUES (1,704798,'LIRF_TWR','2026-09-20 10:00:00',3600,0,'Poller',1,0,0,0);"
          # La domanda dell'hub (T12): chi era online nell'intervallo, con due giorni di margine all'indietro.
          letta=$(hub "SELECT callsign FROM v_share_atc_sessions
                       WHERE start_utc <= '2026-09-21' AND start_utc >= DATE_SUB('2026-09-20 11:00', INTERVAL 2 DAY)
                         AND (end_utc IS NULL OR end_utc >= '2026-09-20 11:00');")
          [ "$letta" = "LIRF_TWR" ] || fallisci "l'utente dell'hub legge '$letta' dalla vista invece di 'LIRF_TWR'"
          if hub "SELECT COUNT(*) FROM AtcSessions;" 2>/dev/null; then
            fallisci "l'utente dell'hub legge AtcSessions: il GRANT sulla sola vista non basta a tenerlo fuori"
          fi
          sql "DELETE FROM AtcSessions;"
          root "DROP USER 'hub_lettore'@'%';"

          echo "tutte e quattro le verifiche passate."

      # La copia del database che l'Admin scarica da Diagnostica (§A47): scritta col codice del sito, reimportata
      # col client `mariadb` in un database vuoto, confrontata con CHECKSUM TABLE tabella per tabella. I test
      # unitari provano il file; solo un server vero prova che il file TORNA. La copia legge con l'utente
      # limitato (quello di produzione), il ripristino lo fa root perché deve creare un database.
      # ⚠️ Provato rosso il 16 settembre 2026 togliendo NO_AUTO_VALUE_ON_ZERO dalla testata: cade su ProvaCopia.
      - name: Copia del database, andata e ritorno
        env:
          MARIADB: "docker run --rm -i --network host mariadb:11.4.10 mariadb -h 127.0.0.1 -P 3306 -u root -pradice-di-prova"
          SORGENTE: itivao_atc
        run: bash tools/Vipi.DbBackup/andata-e-ritorno.sh

  # L'immagine è ciò che gira davvero su Render: se il Dockerfile si rompe, i test verdi non se ne accorgono.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build dell'immagine (stesso Dockerfile del deploy)
        run: docker build -t vipi:ci .
      - name: Smoke del container
        run: |
          # DB su /tmp: nell'immagine aspnet il processo gira come utente non-root e /app non è scrivibile.
          # VipiAuth spento: senza i segreti OIDC l'avvio in Production fallirebbe (vedi Auth/VipiAuth).
          docker run -d --name vipi -p 8080:8080 \
            -e VipiAuth__Enabled=false \
            -e ConnectionStrings__Vipi="Data Source=/tmp/vipi.db" \
            vipi:ci
          # Stesso endpoint che sonda Render: 200 se il DB risponde e lo schema è allineato, 503 altrimenti.
          # -f rende il curl il vero criterio di successo. Non si usa /vsop/health perché degraderebbe per la
          # cache ATC vuota (nessuna credenziale IVAO in CI), che qui non è un difetto.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/vsop/health/ready; then echo; echo "container su"; exit 0; fi
            sleep 2
          done
          echo "il container non ha risposto in 60s"
          docker logs vipi
          exit 1
      - name: Log del container
        if: always()
        run: docker logs vipi || true
