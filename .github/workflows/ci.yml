name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Vipi.slnx
      - run: dotnet build Vipi.slnx --no-restore -c Release
      - run: dotnet test Vipi.slnx --no-build -c Release --verbosity normal
